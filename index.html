<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RisEdge ATS CV Builder - V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .font-ar { font-family: 'Cairo', sans-serif; }
        .font-en { font-family: 'Inter', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .a4-paper {
            width: 210mm;
            height: 297mm;
            background: white;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            position: relative;
            page-break-after: always;
        }

        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            * {
                background: transparent !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }
            
            html, body {
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            
            body {
                background: white !important;
                color: black !important;
            }
            
            body * { visibility: hidden; }
            
            #cv-document, #cv-document * { 
                visibility: visible; 
            }
            
            #cv-document {
                position: absolute;
                left: 0;
                top: 0;
                width: 210mm;
                height: 297mm;
                margin: 0;
                padding: 0;
                background: white !important;
                color: black;
                box-shadow: none !important;
                page-break-after: always;
            }
            
            .print\:hidden { display: none !important; }
            
            a {
                text-decoration: none;
                color: inherit;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 selection:bg-teal-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [lang, setLang] = useState('ar');

            const translations = {
                ar: {
                    appName: "منصة RisEdge لبناء السير الذاتية الاحترافية",
                    switchBtn: "Switch to English",
                    printBtn: "تحميل PDF متوافق مع ATS",
                    personal: "البيانات الشخصية والاتصال",
                    fullName: "الاسم بالكامل",
                    jobTitle: "المسمى الوظيفي",
                    email: "البريد الإلكتروني",
                    phone: "رقم الهاتف",
                    location: "الموقع (المدينة، الدولة)",
                    linkedin: "رابط حساب لينكد إن",
                    summary: "الملخص المهني (Summary)",
                    experience: "الخبرات المهنية (Experience)",
                    education: "التعليم الأكاديمي (Education)",
                    certificates: "الشهادات والكورسات (Certifications)",
                    languages: "اللغات (Languages)",
                    skills: "المهارات الرئيسية (Core Skills)",
                    addExpBtn: "+ إضافة خبرة",
                    addEduBtn: "+ إضافة تعليم",
                    addCertBtn: "+ إضافة شهادة",
                    addLangBtn: "+ إضافة لغة",
                    company: "اسم الشركة / المؤسسة",
                    role: "الدور الوظيفي",
                    date: "التاريخ (من - إلى)",
                    desc: "المهام والإنجازات",
                    school: "الجامعة / الكلية",
                    degree: "الدرجة العلمية",
                    year: "سنة التخرج",
                    certName: "اسم الشهادة / الكورس",
                    authority: "الجهة المانحة",
                    certYear: "سنة الحصول عليها",
                    langName: "اللغة",
                    langLevel: "المستوى (مثال: لغة الأم، طلاقة)",
                    skillsPlaceholder: "أدخل المهارات وافصل بينها بفاصلة",
                    deleteBtn: "حذف",
                    footerNotice: "تمت المراجعة والتطوير بواسطة أدوات RisEdge المهنية | 2026"
                },
                en: {
                    appName: "RisEdge Premium CV Builder",
                    switchBtn: "التبديل للعربية",
                    printBtn: "Download ATS PDF",
                    personal: "Contact Info",
                    fullName: "Full Name",
                    jobTitle: "Job Title",
                    email: "Email Address",
                    phone: "Phone Number",
                    location: "Location",
                    linkedin: "LinkedIn URL",
                    summary: "Professional Summary",
                    experience: "Experience",
                    education: "Education",
                    certificates: "Certifications",
                    languages: "Languages",
                    skills: "Core Skills",
                    addExpBtn: "+ Add Experience",
                    addEduBtn: "+ Add Education",
                    addCertBtn: "+ Add Certification",
                    addLangBtn: "+ Add Language",
                    company: "Company Name",
                    role: "Job Role",
                    date: "Period (e.g., 2023 - Present)",
                    desc: "Key Responsibilities",
                    school: "Institution",
                    degree: "Degree",
                    year: "Year",
                    certName: "Cert Title",
                    authority: "Issuing Org",
                    certYear: "Year",
                    langName: "Language",
                    langLevel: "Proficiency (e.g., Native, Fluent)",
                    skillsPlaceholder: "Enter skills separated by commas",
                    deleteBtn: "Remove",
                    footerNotice: "Developed via RisEdge Professional Career Tools | 2026"
                }
            };

            const defaultData = {
                ar: {
                    personal: { fullName: 'حازم موسى', jobTitle: 'مستشار موارد بشرية وخبير تطوير تنظيمي', email: 'hazem@risedge.com', phone: '+20 100 000 0000', location: 'الإسكندرية، مصر', linkedin: 'linkedin.com/in/hazemmoussa' },
                    summary: 'مستشار موارد بشرية وخبير متمرس في التطوير التنظيمي وإعادة هيكلة الشركات وبناء الكوادر البشرية والتدريب الاحترافي. متخصص في دمج الأنظمة الرقمية الحديثة وتطبيقات الذكاء الاصطناعي لأتمتة عمليات الأجور والرواتب وشؤون العاملين.',
                    experience: [
                        { id: 1, company: 'RisEdge Consulting', role: 'المؤسس ومستشار الموارد البشرية الرئيسي', date: '2023 - الحاضر', desc: '• قيادة وتقديم الاستشارات الاستراتيجية في مجالات الهياكل التنظيمية وإدارة المواهب للشركات.\n• تصميم وتنفيذ برامج تدريبية متخصصة لرفع كفاءة مديري وموظفي الإدارات المختلفة.\n• تطوير أدوات رقمية وحلول أتمتة متقدمة لحساب الأجور والتأمينات الاجتماعية.' }
                    ],
                    education: [
                        { id: 1, school: 'جامعة الإسكندرية', degree: 'بكالوريوس التجارة', year: '2007' }
                    ],
                    certificates: [
                        { id: 1, name: 'شهادة محترف موارد بشرية معتمد (CHRP)', authority: 'إدارة الأعمال والموارد البشرية الدولية', year: '2015' }
                    ],
                    languages: [
                        { id: 1, name: 'العربية', level: 'اللغة الأم' },
                        { id: 2, name: 'الإنجليزية', level: 'طلاقة (احترافي)' }
                    ],
                    skills: 'التطوير التنظيمي (OD)، ق��نون العمل المصري، هيكلة الأجور والمزايا، أتمتة الرواتب بالذكاء الاصطناعي، التدريب والتوجيه الاحترافي، إدارة شؤون العاملين'
                },
                en: {
                    personal: { fullName: 'Hazem Moussa', jobTitle: 'HR Consultant & Organizational Development Expert', email: 'hazem@risedge.com', phone: '+20 100 000 0000', location: 'Alexandria, Egypt', linkedin: 'linkedin.com/in/hazemmoussa' },
                    summary: 'Seasoned HR Consultant and Organizational Development Expert specialized in corporate restructuring, premium corporate training, and talent development. Master of modern Egyptian labor legislations and digital transformation strategies.',
                    experience: [
                        { id: 1, company: 'RisEdge Consulting', role: 'Founder & Principal HR Consultant', date: '2023 - Present', desc: '• Leading custom structural restructuring and performance matrix engineering for elite organizations.\n• Instructing and facilitating highly specialized corporate development workshops and dynamic human capital bootcamps.' }
                    ],
                    education: [
                        { id: 1, school: 'Alexandria University', degree: 'Bachelor of Commerce', year: '2007' },
                    ],
                    certificates: [
                        { id: 1, name: 'Certified Human Resources Professional (CHRP)', authority: 'International HR Certification Institute', year: '2015' }
                    ],
                    languages: [
                        { id: 1, name: 'Arabic', level: 'Native' },
                        { id: 2, name: 'English', level: 'Full Professional Proficiency' }
                    ],
                    skills: 'Organizational Development (OD), Egyptian Labor Law, Strategic Training & Facilitation, AI Payroll Integrations, Compensation & Benefits, Personnel Affairs Strategy'
                }
            };

            const [data, setData] = useState(defaultData[lang]);
            const t = translations[lang];

            const handleLangSwitch = () => {
                const newLang = lang === 'ar' ? 'en' : 'ar';
                setLang(newLang);
                setData(defaultData[newLang]);
            };

            const handlePrint = () => {
                window.print();
            };

            const updatePersonal = (field, value) => {
                setData({ ...data, personal: { ...data.personal, [field]: value } });
            };

            const addItem = (listName, template) => {
                setData({ ...data, [listName]: [...data[listName], { id: Date.now(), ...template }] });
            };

            const updateItem = (listName, id, field, value) => {
                const updated = data[listName].map(item => item.id === id ? { ...item, [field]: value } : item);
                setData({ ...data, [listName]: updated });
            };

            const deleteItem = (listName, id) => {
                setData({ ...data, [listName]: data[listName].filter(item => item.id !== id) });
            };

            return (
                <div className={`flex flex-col h-screen ${lang === 'ar' ? 'font-ar' : 'font-en'}`} dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    
                    {/* TOP NAVBAR (Hidden on Print) */}
                    <header className="bg-[#0b2222] text-white px-6 py-4 flex justify-between items-center print:hidden shadow-lg z-30 border-b border-teal-800">
                        <div className="flex items-center gap-3">
                            <img src="./logo.jpg" alt="RisEdge Logo" className="h-10 w-10 object-cover rounded-md border border-teal-600" onError={(e)=>{e.target.style.display='none'}} />
                            <div>
                                <h1 className="text-lg font-black tracking-wide text-teal-300">RisEdge</h1>
                                <p className="text-xs text-gray-400 -mt-1">{t.appName}</p>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={handleLangSwitch} className="px-4 py-2 bg-teal-900/60 hover:bg-teal-800 border border-teal-700 rounded-lg text-xs font-bold transition-all duration-200">
                                {t.switchBtn}
                            </button>
                            <button onClick={handlePrint} className="px-5 py-2 bg-teal-600 hover:bg-teal-500 rounded-lg text-xs font-bold transition-all duration-200 flex items-center gap-2 shadow-md shadow-teal-950">
                                <i className="fas fa-print"></i> {t.printBtn}
                            </button>
                        </div>
                    </header>

                    {/* MAIN WORKSPACE */}
                    <div className="flex flex-1 overflow-hidden">
                        
                        {/* INPUT PANEL (Hidden on Print) */}
                        <aside className="w-1/3 min-w-[380px] bg-white border-l border-r border-slate-200 p-6 overflow-y-auto custom-scrollbar print:hidden shadow-inner">
                            {/* Personal Info */}
                            <section className="mb-6">
                                <h2 className="text-sm font-bold uppercase tracking-wider text-teal-800 mb-4 pb-1 border-b border-teal-100">{t.personal}</h2>
                                <div className="space-y-3">
                                    <input type="text" placeholder={t.fullName} value={data.personal.fullName} onChange={(e) => updatePersonal('fullName', e.target.value)} className="w-full text-sm border border-slate-300 p-2 rounded focus:border-teal-600 outline-none" />
                                    <input type="text" placeholder={t.jobTitle} value={data.personal.jobTitle} onChange={(e) => updatePersonal('jobTitle', e.target.value)} className="w-full text-sm border border-slate-300 p-2 rounded focus:border-teal-600 outline-none" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="text" placeholder={t.email} value={data.personal.email} onChange={(e) => updatePersonal('email', e.target.value)} className="w-full text-sm border border-slate-300 p-2 rounded focus:border-teal-600 outline-none" dir="ltr" />
                                        <input type="text" placeholder={t.phone} value={data.personal.phone} onChange={(e) => updatePersonal('phone', e.target.value)} className="w-full text-sm border border-slate-300 p-2 rounded focus:border-teal-600 outline-none" dir="ltr" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="text" placeholder={t.location} value={data.personal.location} onChange={(e) => updatePersonal('location', e.target.value)} className="w-full text-sm border border-slate-300 p-2 rounded focus:border-teal-600 outline-none" />
                                        <input type="text" placeholder={t.linkedin} value={data.personal.linkedin} onChange={(e) => updatePersonal('linkedin', e.target.value)} className="w-full text-sm border border-slate-300 p-2 rounded focus:border-teal-600 outline-none" dir="ltr" />
                                    </div>
                                </div>
                            </section>

                            <section className="mb-6">
                                <h2 className="text-sm font-bold uppercase tracking-wider text-teal-800 mb-2">{t.summary}</h2>
                                <textarea rows="4" value={data.summary} onChange={(e) => setData({...data, summary: e.target.value})} className="w-full text-sm border border-slate-300 p-2 rounded outline-none resize-none"></textarea>
                            </section>

                            {/* Dynamic Sections */}
                            {[
                                { name: 'experience', title: t.experience, addBtn: t.addExpBtn, fields: [{n:'role', p:t.role}, {n:'company', p:t.company}, {n:'date', p:t.date}, {n:'desc', p:t.desc, area:true}], template: {role:'', company:'', date:'', desc:''} },
                                { name: 'education', title: t.education, addBtn: t.addEduBtn, fields: [{n:'degree', p:t.degree}, {n:'school', p:t.school}, {n:'year', p:t.year}], template: {degree:'', school:'', year:''} },
                                { name: 'certificates', title: t.certificates, addBtn: t.addCertBtn, fields: [{n:'name', p:t.certName}, {n:'authority', p:t.authority}, {n:'year', p:t.certYear}], template: {name:'', authority:'', year:''} },
                                { name: 'languages', title: t.languages, addBtn: t.addLangBtn, fields: [{n:'name', p:t.langName}, {n:'level', p:t.langLevel}], template: {name:'', level:''} }
                            ].map(sec => (
                                <section key={sec.name} className="mb-6">
                                    <div className="flex justify-between items-center mb-3 pb-1 border-b border-teal-100">
                                        <h2 className="text-sm font-bold uppercase tracking-wider text-teal-800">{sec.title}</h2>
                                        <button onClick={() => addItem(sec.name, sec.template)} className="text-[10px] bg-teal-50 text-teal-700 px-2 py-1 rounded font-bold">{sec.addBtn}</button>
                                    </div>
                                    {data[sec.name].map(item => (
                                        <div key={item.id} className="p-3 bg-slate-50 rounded border mb-3 relative group">
                                            <button onClick={() => deleteItem(sec.name, item.id)} className="absolute top-1 left-1 text-[10px] text-red-500 opacity-0 group-hover:opacity-100 transition">{t.deleteBtn}</button>
                                            <div className="space-y-2 pt-2">
                                                {sec.fields.map(f => (
                                                    f.area ? 
                                                    <textarea key={f.n} rows="2" placeholder={f.p} value={item[f.n]} onChange={(e) => updateItem(sec.name, item.id, f.n, e.target.value)} className="w-full text-xs border p-1.5 rounded outline-none"></textarea> :
                                                    <input key={f.n} type="text" placeholder={f.p} value={item[f.n]} onChange={(e) => updateItem(sec.name, item.id, f.n, e.target.value)} className="w-full text-xs border p-1.5 rounded outline-none" />
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </section>
                            ))}

                            <section>
                                <h2 className="text-sm font-bold uppercase tracking-wider text-teal-800 mb-2">{t.skills}</h2>
                                <textarea rows="3" placeholder={t.skillsPlaceholder} value={data.skills} onChange={(e) => setData({...data, skills: e.target.value})} className="w-full text-sm border p-2 rounded outline-none"></textarea>
                            </section>
                        </aside>

                        {/* PREVIEW PANEL */}
                        <main className="flex-1 bg-slate-200 overflow-y-auto p-4 flex justify-center items-start custom-scrollbar">
                            <div id="cv-document" className="a4-paper flex flex-col text-slate-900">
                                <div className="relative flex flex-col h-full w-full" style={{padding: '15mm 12mm', color: 'black', fontSize: '11pt', lineHeight: '1.4', fontFamily: lang === 'ar' ? "'Cairo', sans-serif" : "'Inter', sans-serif"}}>
                                    
                                    {/* Header Section */}
                                    <div className="text-center mb-4 pb-3" style={{borderBottom: '2px solid black'}}>
                                        <h1 style={{fontSize: '18pt', fontWeight: 'bold', marginBottom: '4px'}}>{data.personal.fullName || t.fullName}</h1>
                                        <h2 style={{fontSize: '11pt', fontWeight: '600', marginBottom: '8px'}}>{data.personal.jobTitle || t.jobTitle}</h2>
                                        <div style={{fontSize: '10pt', display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '8px'}}>
                                            {data.personal.location && <span>{data.personal.location}</span>}
                                            {data.personal.phone && <span>•</span>}
                                            {data.personal.phone && <span dir="ltr">{data.personal.phone}</span>}
                                            {data.personal.email && <span>•</span>}
                                            {data.personal.email && <span>{data.personal.email}</span>}
                                            {data.personal.linkedin && <span>•</span>}
                                            {data.personal.linkedin && <span>{data.personal.linkedin}</span>}
                                        </div>
                                    </div>

                                    {/* Content Sections */}
                                    <div className="flex-1 overflow-y-auto">
                                        {/* Summary */}
                                        {data.summary && (
                                            <div style={{marginBottom: '12px'}}>
                                                <h3 style={{fontSize: '11pt', fontWeight: 'bold', borderBottom: '1px solid black', marginBottom: '6px', paddingBottom: '2px'}}>{t.summary}</h3>
                                                <p style={{fontSize: '10pt', textAlign: 'justify', lineHeight: '1.5', whiteSpace: 'pre-wrap'}}>{data.summary}</p>
                                            </div>
                                        )}

                                        {/* Experience */}
                                        {data.experience.length > 0 && (
                                            <div style={{marginBottom: '12px'}}>
                                                <h3 style={{fontSize: '11pt', fontWeight: 'bold', borderBottom: '1px solid black', marginBottom: '8px', paddingBottom: '2px'}}>{t.experience}</h3>
                                                {data.experience.map((exp, idx) => (
                                                    <div key={exp.id} style={{marginBottom: idx < data.experience.length - 1 ? '10px' : '0', paddingBottom: '8px', borderBottom: idx < data.experience.length - 1 ? '0.5px solid #ddd' : 'none'}}>
                                                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '3px'}}>
                                                            <span style={{fontSize: '10.5pt', fontWeight: 'bold'}}>{exp.role}</span>
                                                            <span dir="ltr" style={{fontSize: '9.5pt', fontWeight: 'bold'}}>{exp.date}</span>
                                                        </div>
                                                        <div style={{fontSize: '10pt', fontWeight: '600', fontStyle: 'italic', marginBottom: '4px'}}>{exp.company}</div>
                                                        <p style={{fontSize: '10pt', whiteSpace: 'pre-wrap', lineHeight: '1.4', color: '#333'}}>{exp.desc}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {/* Education */}
                                        {data.education.length > 0 && (
                                            <div style={{marginBottom: '12px'}}>
                                                <h3 style={{fontSize: '11pt', fontWeight: 'bold', borderBottom: '1px solid black', marginBottom: '8px', paddingBottom: '2px'}}>{t.education}</h3>
                                                {data.education.map((edu, idx) => (
                                                    <div key={edu.id} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', fontSize: '10pt', marginBottom: idx < data.education.length - 1 ? '6px' : '0', paddingBottom: idx < data.education.length - 1 ? '4px' : '0', borderBottom: idx < data.education.length - 1 ? '0.5px solid #ddd' : 'none'}}>
                                                        <div><span style={{fontWeight: 'bold'}}>{edu.degree}</span> | {edu.school}</div>
                                                        <span style={{fontWeight: 'bold', fontSize: '9.5pt'}} dir="ltr">{edu.year}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {/* Certificates */}
                                        {data.certificates.length > 0 && (
                                            <div style={{marginBottom: '12px'}}>
                                                <h3 style={{fontSize: '11pt', fontWeight: 'bold', borderBottom: '1px solid black', marginBottom: '8px', paddingBottom: '2px'}}>{t.certificates}</h3>
                                                {data.certificates.map((cert, idx) => (
                                                    <div key={cert.id} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', fontSize: '10pt', marginBottom: idx < data.certificates.length - 1 ? '6px' : '0', paddingBottom: idx < data.certificates.length - 1 ? '4px' : '0', borderBottom: idx < data.certificates.length - 1 ? '0.5px solid #ddd' : 'none'}}>
                                                        <div><span style={{fontWeight: 'bold'}}>{cert.name}</span> | {cert.authority}</div>
                                                        <span style={{fontWeight: 'bold', fontSize: '9.5pt'}} dir="ltr">{cert.year}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {/* Languages */}
                                        {data.languages.length > 0 && (
                                            <div style={{marginBottom: '12px'}}>
                                                <h3 style={{fontSize: '11pt', fontWeight: 'bold', borderBottom: '1px solid black', marginBottom: '6px', paddingBottom: '2px'}}>{t.languages}</h3>
                                                <div style={{fontSize: '10pt'}}>
                                                    {data.languages.map((l, i) => (
                                                        <span key={l.id}>{l.name} ({l.level}){i < data.languages.length-1 ? ' • ' : ''}</span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* Skills */}
                                        {data.skills && (
                                            <div>
                                                <h3 style={{fontSize: '11pt', fontWeight: 'bold', borderBottom: '1px solid black', marginBottom: '6px', paddingBottom: '2px'}}>{t.skills}</h3>
                                                <p style={{fontSize: '10pt', lineHeight: '1.5', textAlign: 'justify'}}>{data.skills}</p>
                                            </div>
                                        )}
                                    </div>

                                    {/* Footer */}
                                    <div style={{textAlign: 'center', marginTop: '8px', paddingTop: '8px', fontSize: '8pt', color: '#999'}} className="print:hidden">
                                        {t.footerNotice}
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
